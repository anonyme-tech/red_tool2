<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2 Framework - Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Poppins', 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-image: url('/static/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        /* Overlay léger pour lisibilité */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
        }
        
        /* Effet matrix / code overlay pour rappel "persistance" */
        .matrix-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 255, 0.03) 0px,
                rgba(0, 255, 255, 0.03) 2px,
                transparent 2px,
                transparent 6px
            );
            pointer-events: none;
            z-index: 1;
        }
        
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .login-card {
            background: linear-gradient(135deg, rgba(10, 20, 40, 0.9), rgba(0, 50, 100, 0.85));
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 45px 40px;
            width: 440px;
            border: 1px solid rgba(0, 150, 255, 0.4);
            box-shadow: 0 0 40px rgba(0, 100, 200, 0.15);
            transition: all 0.3s ease;
        }
        
        .login-card:hover {
            border-color: rgba(0, 200, 255, 0.7);
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.25);
        }
        
        .header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .logo-icon {
            font-size: 55px;
            margin-bottom: 10px;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 5px #0088ff; }
            50% { text-shadow: 0 0 20px #00aaff; }
        }
        
        .title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #00ccff, #0066cc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 3px;
        }
        
        .subtitle {
            color: #88bbdd;
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 1px;
        }
        
        .tagline {
            color: #44aaff;
            font-size: 11px;
            margin-top: 10px;
            font-family: monospace;
            border-top: 1px solid rgba(0, 150, 255, 0.3);
            padding-top: 12px;
        }
        
        .input-group {
            margin-bottom: 22px;
        }
        
        .input-group label {
            display: block;
            color: #88ccff;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid #2266aa;
            border-radius: 12px;
            color: #ccf0ff;
            font-size: 14px;
            transition: all 0.3s;
            font-family: monospace;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #44aaff;
            box-shadow: 0 0 15px rgba(68, 170, 255, 0.3);
            background: rgba(0, 0, 0, 0.7);
        }
        
        .input-group input::placeholder {
            color: #4477aa;
            font-family: monospace;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2266aa, #004488);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            font-family: monospace;
            letter-spacing: 2px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(68, 170, 255, 0.3);
            background: linear-gradient(135deg, #3388cc, #0055aa);
        }
        
        .error-message {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid #ff6666;
            border-radius: 10px;
            padding: 10px;
            margin-top: 18px;
            color: #ff8888;
            font-size: 12px;
            text-align: center;
            display: none;
            font-family: monospace;
        }
        
        .status-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            font-size: 11px;
            color: #88bbdd;
            font-family: monospace;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff4444;
            transition: all 0.3s;
        }
        
        .status-dot.online {
            background-color: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 10px;
            color: #5588aa;
            border-top: 1px solid rgba(68, 170, 255, 0.2);
            padding-top: 18px;
            font-family: monospace;
        }
        
        .persistence-badge {
            text-align: center;
            margin-top: 15px;
            font-size: 10px;
            color: #44aaff;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="matrix-overlay"></div>
    
    <div class="container">
        <div class="login-card">
            <div class="header">
                <div class="logo-icon">🎯</div>
                <div class="title">C2 FRAMEWORK</div>
                <div class="subtitle">Command & Control - Red Team Suite</div>
                <div class="tagline">⚡ PERSISTANCE SIMULATION SUITE ⚡</div>
            </div>
            
            <div class="input-group">
                <label>👤 USERNAME</label>
                <input type="text" id="username" placeholder="Entrez votre nom d'utilisateur" autocomplete="off">
            </div>
            
            <div class="input-group">
                <label>🔐 PASSWORD</label>
                <input type="password" id="password" placeholder="Entrez votre mot de passe" autocomplete="off">
            </div>
            
            <button onclick="login()">AUTHENTICATE</button>
            
            <div class="error-message" id="error-message">
                ⚠️ ACCESS DENIED - Invalid credentials
            </div>
            
            <div class="status-indicator">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">Checking server connection...</span>
            </div>
            
            <div class="persistence-badge">
                [ MITRE ATT&CK T1547 | T1053 | T1543 | T1546 | Phantom Persist ]
            </div>
            
            <div class="footer">
                <p>🔒 Authorized use only - Red Team Operations</p>
                <p style="margin-top: 6px;">© 2026 - Persistence Framework C2</p>
            </div>
        </div>
    </div>
    
    <script>
        async function checkServerStatus() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            
            try {
                const response = await fetch('/api/health');
                if (response.ok) {
                    statusDot.classList.add('online');
                    statusText.innerHTML = '✅ C2 Server Online - Ready';
                } else {
                    statusDot.classList.remove('online');
                    statusText.innerHTML = '⚠️ Server Unstable';
                }
            } catch (error) {
                statusDot.classList.remove('online');
                statusText.innerHTML = '❌ C2 Server Offline';
            }
        }
        
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            
            if (!username || !password) {
                errorDiv.textContent = '⚠️ Veuillez remplir tous les champs';
                errorDiv.style.display = 'block';
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 3000);
                return;
            }
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);
                    window.location.href = '/static/dashboard.html';
                } else {
                    const error = await response.json();
                    errorDiv.textContent = '❌ ' + (error.detail || 'Identifiants incorrects');
                    errorDiv.style.display = 'block';
                    setTimeout(() => {
                        errorDiv.style.display = 'none';
                    }, 3000);
                }
            } catch (error) {
                errorDiv.textContent = '❌ Erreur de connexion au serveur C2';
                errorDiv.style.display = 'block';
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 3000);
            }
        }
        
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
        
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
        
        checkServerStatus();
        setInterval(checkServerStatus, 10000);
    </script>
</body>
</html>
